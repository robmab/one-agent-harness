<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 530" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .q{font-size:13.5px;fill:#ffffff;opacity:.92}
    .t{font-size:21px;font-weight:700;fill:#ffffff;letter-spacing:.5px}
    .def{font-size:13px;fill:#334155}
    .n{font-size:14px;font-weight:700}
    .s{font-size:12.5px;fill:#475569}
    .pill{font-size:10.5px;font-weight:700;letter-spacing:.6px}
    .foot{font-size:12.5px;fill:#334155;font-style:italic}
    .band{font-size:14px;font-weight:600;fill:#ffffff}
    .lg{font-size:12.5px;fill:#334155}
    .rl{fill:#fef3c7} .rlt{fill:#92400e}
    .aj{fill:#e0f2fe} .ajt{fill:#075985}
    .li{fill:#dcfce7} .lit{fill:#166534}
  </style>
  <rect width="1120" height="530" rx="16" fill="#f8fafc"/>

  <!-- CONOCIMIENTO -->
  <rect x="20" y="20" width="348" height="410" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="20" y="20" width="348" height="72" rx="14" fill="#2563eb"/>
  <rect x="20" y="70" width="348" height="22" fill="#2563eb"/>
  <text x="40" y="52" class="t">CONOCIMIENTO</text>
  <text x="40" y="76" class="q">¿Qué tiene que saber?</text>
  <text x="40" y="120" class="def">Lo que el modelo no puede deducir</text>
  <text x="40" y="138" class="def">leyendo el código ni sabe de memoria.</text>

  <text x="40" y="172" class="n" fill="#1e3a8a">conventions</text>
  <rect x="276" y="160" width="72" height="17" rx="8.5" class="rl"/><text x="312" y="172" class="pill rlt" text-anchor="middle">FILL-IN</text>
  <text x="40" y="191" class="s">cómo se escribe el código del proyecto</text>

  <text x="40" y="226" class="n" fill="#1e3a8a">ui</text>
  <rect x="276" y="214" width="72" height="17" rx="8.5" class="rl"/><text x="312" y="226" class="pill rlt" text-anchor="middle">FILL-IN</text>
  <text x="40" y="245" class="s">design system: solo maquetación y estilos</text>

  <text x="40" y="280" class="n" fill="#1e3a8a">stack</text>
  <rect x="284" y="268" width="64" height="17" rx="8.5" class="aj"/><text x="316" y="280" class="pill ajt" text-anchor="middle">ADJUST</text>
  <text x="40" y="299" class="s">versiones reales del stack y sus trampas</text>

  <text x="40" y="334" class="n" fill="#1e3a8a">voice</text>
  <rect x="270" y="322" width="78" height="17" rx="8.5" fill="#e2e8f0"/><text x="309" y="334" class="pill" fill="#334155" text-anchor="middle">OPTIONAL</text>
  <text x="40" y="353" class="s">tu voz en los comentarios y en el chat</text>

  <line x1="40" y1="372" x2="348" y2="372" stroke="#e2e8f0"/>
  <text x="40" y="396" class="foot">Se añade cuando hay algo que el modelo</text>
  <text x="40" y="414" class="foot">no puede saber por sí mismo.</text>

  <!-- PROCESO -->
  <rect x="386" y="20" width="348" height="410" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="386" y="20" width="348" height="72" rx="14" fill="#16a34a"/>
  <rect x="386" y="70" width="348" height="22" fill="#16a34a"/>
  <text x="406" y="52" class="t">PROCESO</text>
  <text x="406" y="76" class="q">¿Cómo tiene que trabajar?</text>
  <text x="406" y="120" class="def">Corrige las manías del modelo: inventar,</text>
  <text x="406" y="138" class="def">parchear a ciegas, darlo por hecho.</text>

  <text x="406" y="172" class="n" fill="#14532d">prepare</text>
  <rect x="664" y="160" width="50" height="17" rx="8.5" class="li"/><text x="689" y="172" class="pill lit" text-anchor="middle">READY</text>
  <text x="406" y="191" class="s">entender antes de hacer</text>

  <text x="406" y="226" class="n" fill="#14532d">diagnose</text>
  <rect x="650" y="214" width="64" height="17" rx="8.5" class="aj"/><text x="682" y="226" class="pill ajt" text-anchor="middle">ADJUST</text>
  <text x="406" y="245" class="s">causa raíz antes de arreglar</text>

  <text x="406" y="280" class="n" fill="#14532d">verify</text>
  <rect x="650" y="268" width="64" height="17" rx="8.5" class="aj"/><text x="682" y="280" class="pill ajt" text-anchor="middle">ADJUST</text>
  <text x="406" y="299" class="s">pruebas antes de decir «hecho»</text>

  <line x1="406" y1="372" x2="714" y2="372" stroke="#e2e8f0"/>
  <text x="406" y="396" class="foot">Se añade solo si lo hemos visto fallar</text>
  <text x="406" y="414" class="foot">y el fallo se repite.</text>

  <!-- CONTROL -->
  <rect x="752" y="20" width="348" height="410" rx="14" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <rect x="752" y="20" width="348" height="72" rx="14" fill="#ea580c"/>
  <rect x="752" y="70" width="348" height="22" fill="#ea580c"/>
  <text x="772" y="52" class="t">CONTROL</text>
  <text x="772" y="76" class="q">¿Quién lo comprueba?</text>
  <text x="772" y="120" class="def">No son skills: un script y un solo agente</text>
  <text x="772" y="138" class="def">que miran lo que ya está escrito.</text>

  <text x="772" y="172" class="n" fill="#7c2d12">check + hook</text>
  <rect x="1016" y="160" width="64" height="17" rx="8.5" class="aj"/><text x="1048" y="172" class="pill ajt" text-anchor="middle">ADJUST</text>
  <text x="772" y="191" class="s">automático: reglas del stack y sintaxis</text>

  <text x="772" y="226" class="n" fill="#7c2d12">reviewer</text>
  <rect x="1030" y="214" width="50" height="17" rx="8.5" class="li"/><text x="1055" y="226" class="pill lit" text-anchor="middle">READY</text>
  <text x="772" y="245" class="s">juicio: 6 ejes, convenios incluidos, no edita</text>

  <text x="772" y="280" class="n" fill="#7c2d12">+ checklists</text>
  <text x="772" y="299" class="s">las skills de conocimiento, leídas por el revisor</text>

  <line x1="772" y1="372" x2="1080" y2="372" stroke="#e2e8f0"/>
  <text x="772" y="396" class="foot">Si una regla importa de verdad, que la</text>
  <text x="772" y="414" class="foot">compruebe algo, no la memoria del modelo.</text>

  <!-- guías vs sensores -->
  <rect x="20" y="446" width="714" height="38" rx="10" fill="#334155"/>
  <text x="377" y="470" class="band" text-anchor="middle">GUÍAS · actúan ANTES de que el agente escriba (feedforward)</text>
  <rect x="752" y="446" width="348" height="38" rx="10" fill="#9a3412"/>
  <text x="926" y="470" class="band" text-anchor="middle">SENSORES · comprueban DESPUÉS (feedback)</text>

  <!-- leyenda de la plantilla -->
  <rect x="20" y="500" width="50" height="17" rx="8.5" class="li"/><text x="45" y="512" class="pill lit" text-anchor="middle">READY</text>
  <text x="78" y="513" class="lg">vale tal cual</text>
  <rect x="190" y="500" width="64" height="17" rx="8.5" class="aj"/><text x="222" y="512" class="pill ajt" text-anchor="middle">ADJUST</text>
  <text x="262" y="513" class="lg">el método vale; rellenar sus tablas del proyecto</text>
  <rect x="586" y="500" width="72" height="17" rx="8.5" class="rl"/><text x="622" y="512" class="pill rlt" text-anchor="middle">FILL-IN</text>
  <text x="666" y="513" class="lg">plantilla vacía: el contenido es del proyecto</text>
</svg>
